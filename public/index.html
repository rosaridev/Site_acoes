<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alerta de Ações B3</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>📉 Alerta de preço na B3</h1>
      <p class="subtitle">Crie alertas para ações/FIIs (ex: MXRF11) e seja avisado quando bater seu preço alvo.</p>

      <section class="card">
        <h2>Novo alerta</h2>
        <form id="alertForm">
          <label>
            Ativo (ticker)
            <input id="symbol" placeholder="Ex: MXRF11" required />
          </label>

          <label>
            Preço alvo (R$)
            <input id="targetPrice" type="number" step="0.01" placeholder="9.80" required />
          </label>

          <label>
            Email para alerta (opcional)
            <input id="email" type="email" placeholder="voce@email.com" />
          </label>

          <div class="actions">
            <button type="submit">Salvar alerta</button>
            <button type="button" id="checkNow" class="secondary">Verificar agora</button>
          </div>
        </form>
      </section>

      <section class="card">
        <h2>Alertas salvos</h2>
        <div id="alerts" class="list"></div>
      </section>

      <section class="card">
        <h2>Notificações</h2>
        <div id="notifications" class="list"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
